[workspace]
members = ["figure-8-macros", "."]
resolver = "3"

[package]
name = "figure-8"
version = "0.1.0"
edition = "2024"

[dependencies]
figure-8-macros = { path = "figure-8-macros" }
tokio = { version = "1", features = ["full"] }
v8 = "146"
headless_chrome = "1.0"

serde_json = "1"
thiserror = "2"
